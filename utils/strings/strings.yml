    title_flag: "PR title"
    body_flag: "PR description"

  # Rebase command
  rebase:
    short: "Rebase current branch to configured development main branch(alias: rb)"
    fetching: " Fetching remote branch information...\n"
    rebasing: " Rebasing current branch to %s...\n"
    success: "Successfully rebased current branch to %s"
    no_config: "Development main branch not configured, using default branch 'dev'"
    current_branch_error: "Failed to get current branch: %v"
    rebase_failed: "Rebase failed: %v"

  # Release command
  release:
    short: "Create GitHub release(alias: rl)"
    previous_version: "🌈 Previous version: %s"
    new_version: "🎉 New version: %s"
    step1: "1. Syncing remote branches...\n"
