# GFL CLI Strings File
# Internationalization support for GitHub Flow CLI

# Chinese (Simplified)
zh-CN:
  # Root command
  root:
    short: "GitHub Flow CLI"
    welcome: "🌈 Welcome to "
    confirm_flag: "确认操作"
    debug_flag: "启用调试模式"

  # Init command
  init:
    short: "初始化 Github Flow 配置"
    force_flag: "强制覆盖已存在的配置文件"
    nickname_flag: "设置 Github Flow 昵称 (可选)"
    config_exists_error: "配置文件 %s 已存在，如需覆盖请使用 force 选项"
    create_config_error: "无法创建配置文件: %v"
    generate_yaml_error: "无法生成 YAML: %v"
    write_config_error: "无法写入配置文件: %v"
    gitignore_skip: "配置文件已存在于 .gitignore 中, skip"

  # Copy command
  copy:
    short: "复制当前分支到新分支(alias: cp)"
    copying: " 正在复制分支...\n"
    success: "已成功复制分支 '%s' 到 '%s'"
    confirm_flag: "自动生成分支名时需要确认"
    error:
      dirty: "工作目录不干净，请先提交或暂存更改"
      notInRemote: "当前分支 '%s' 在远程仓库中不存在，请先推送该分支"
      alreadyExists: "分支 '%s' 已存在，请使用其他名称"
      failed: "复制分支失败: %v"
      confirm_required: "未提供分支名，将自动生成 '%s' -> '%s'"
    info:
      from: "源分支"
      to: "目标分支"
      use_confirm_flag: "使用 -y 或 --confirm 标志确认操作"

  # Start command
  start:
    short: "开始一个新功能(alias: s)"
    base_flag: "指定基础分支（@ 表示当前分支）"
    syncing: " 正在同步远程分支...\n"
    creating: " 正在创建分支...\n"
    success: "已创建%s分支: %s"
    check_remote_failed: "检查远程分支失败: %v"
    current_branch_not_exist: "当前分支 '%s' 在远程仓库中不存在，请先推送该分支"
    base_not_exist: "指定的基础分支 '%s' 在远程仓库中不存在，请检查分支名称"

  # Publish command
  publish:
    short: "发布当前分支(alias: p)"
    pushing: " 正在推送当前分支到远程仓库 \n"
    success: "已推送当前分支到远程仓库，并设置上游分支"

  # Hotfix command
  hotfix:
    short: "开始一个hotfix分支(alias: hf, hot)"
    syncing: " 正在同步远程分支...\n"
    creating: " 正在创建Hotfix分支...\n"
    success: "已创建Hotfix分支: %s"

  # Bugfix command
  bugfix:
    short: "开始一个bug修复分支(alias: b, fix)"
    syncing: " 正在同步远程分支...\n"
    creating: " 正在创建Bugfix分支...\n"
    success: "已创建%s分支: %s"

  # Info command
  info:
    short: "显示仓库信息(alias: i)"
    current_branch: "当前分支"
    tracking: "跟踪分支"
    not_tracking: "未跟踪"
    position: "相对位置"
    ahead: "↑%d 领先"
    behind: "↓%d 落后"
    up_to_date: "✓ 与远程同步"
    working_dir: "工作目录"
    working_dir_clean: "✅ 干净"
    working_dir_dirty: "⚠️  有未提交更改"
    remote: "远程仓库"
    not_configured: "未配置"
    user_name: "用户名"
    user_email: "邮箱"

  # Tag command
  tag:
    short: "创建 Git Tag 版本(alias: t)"
    previous_version: "🌈 上一版本: %s"
    new_version: "🎉 新的版本: %s"
    step1: "1. 正在切换到 Release 分支...\n"
    step2: "2. 正在同步远程tag...\n"
    step3: "3.正在创建 Release Tag...\n"
    step4: "4.正在推送 Release Tag...\n"
    step5: "5.正在创建 Release...\n"
    release_success: "Release %s 创建成功！"
    gh_not_installed: "gh cli 未安装，请手动创建 Release..."
    type_flag: "版本类型: major, minor, patch"

  # PR command
  pr:
    short: "创建 PR / Merge Request（MR）(alias: mr)"
    sync_failed: "同步失败，请检查错误信息并重试"
    browser_error: "无法打开浏览器: %v"
    current_branch_error: "无法获取当前分支: %v"
    sync_flag: "同步 production 分支到 develop 分支（检查工作目录后直接合并）"
    open_flag: "打开代码审查列表页面"

  # Checkout command
  checkout:
    short: "交互式的git分支切换(alias: co)"
    choose_branch: "Choose a branch:"

  # Sweep command
  sweep:
    short: "清理包含特定关键词的分支(alias: clean, rm)"
    local_remote_required: "请至少指定一个 --local 或 --remote 标志"
    skip_confirm: "🌱 如需跳过确认，请使用 -y 标志"
    local_branches_error: "获取本地分支列表失败: %v"
    deleting_local: "🚗 正在删除本地分支\n"
    delete_local_error: "删除本地分支 %s 失败: %v"
    delete_local_success: "本地分支 %s 删除成功"
    remote_branches_error: "获取远程分支列表失败: %v"
    deleting_remote: "🚗 正在删除远程分支\n"
    delete_remote_error: "删除远程分支 %s 失败: %v"
    delete_remote_success: "远程分支 %s 删除成功"
    manual_delete: "本地/远程分支 %s 包含关键词 %s，请手动删除"
    local_flag: "清理本地分支"
    remote_flag: "清理远程分支"
    exact_flag: "精确匹配分支名"
    force_flag: "强制删除分支（使用 -D 代替 -d）"

  # Sync command
  sync:
    short: "同步远程仓库到本地仓库/更新所有远程仓库的引用(alias: up)"
    fetching: " 获取远程仓库中...\n"
    fetch_success: "获取远程仓库成功。"
    updating: " 获取远程仓库中...\n"
    sync_success: "成功同步远程仓库到本地。"

  # Forward command
  forward:
    short: "将 main 分支 forward 到 dev 分支(alias: fwd)"
    same_branch_error: "开发分支和发布分支不能相同，请检查配置文件"
    syncing: " 正在同步远程分支...\n"
    sync_error: "同步远程分支失败: %v"
    base_branch_not_exist: "目标分支 %s 在远程仓库中不存在，请先创建该分支"
    head_branch_not_exist: "源分支 %s 在远程仓库中不存在，请先推送该分支"
    creating_pr: " 正在创建 PR...\n"
    create_pr_error: "创建 PR 失败: %v"
    success: "成功创建 PR: %s -> %s"
    title_flag: "PR 标题"
    body_flag: "PR 描述"

  # Rebase command
  rebase:
    short: "将当前分支rebase到配置的开发主分支(alias: rb)"
    fetching: " 正在获取远程分支信息...\n"
    rebasing: " 正在rebase当前分支到 %s...\n"
    success: "成功将当前分支rebase到 %s"
    no_config: "未配置开发主分支，使用默认分支 'dev'"
    current_branch_error: "无法获取当前分支: %v"
    rebase_failed: "Rebase失败: %v"

  # Release command
  release:
    short: "创建 GitHub Release(alias: rl)"
    previous_version: "🌈 上一版本: %s"
    new_version: "🎉 新的版本: %s"
    step1: "1. 正在同步远程分支...\n"
    step2: "2.正在创建 Release...\n"
    step3: "3.正在推送 Release...\n"
    release_success: "Release %s 创建成功！"
    type_flag: "版本类型: major, minor, patch"
    hotfix_flag: "是否为紧急修复版本"

  # Config command
  config:
    short: "查看当前配置(alias: c)"
    long: "显示当前 GFL 的配置信息，包括所有配置来源和最终值"
    title: "⚙️ GFL 最终配置"
    config_key: "配置项"
    final_value: "最终值"
    source: "来源"
    default_value: "默认值"
    custom_config: "自定义配置"
    local_config: "本地配置"
    global_config: "全局配置"
    debug_mode: "调试模式"
    develop_base_branch: "开发基础分支"
    production_branch: "生产分支"
    nickname: "昵称"
    feature_prefix: "功能分支前缀"
    fix_prefix: "修复分支前缀"
    hotfix_prefix: "热修复分支前缀"
    branch_case_format: "分支名称格式"
    platform: "PR/MR 平台"
    example_feature_branch: "示例功能分支"
    config_sources_title: "\n📁 配置来源详情:\n"
    custom_config_file: "🎯 自定义配置: %s (GFL_CONFIG_FILE)\n"
    priority_title: "\n🏆 配置优先级 (从高到低):\n\n"
    priority_custom: "🥇 自定义配置文件 (GFL_CONFIG_FILE)\n"
    priority_local: "🥈 本地配置文件 (.gfl.config.local.yml)\n"
    priority_global: "🥉 全局配置文件 (.gfl.config.yml)\n"
    priority_default: "🏅 默认值\n"

  # Rename command
  rename:
    short: "重命名分支 (支持本地和远程)(alias: mv)"
    local_flag: "重命名本地分支"
    remote_flag: "重命名远程分支"
    delete_flag: "删除远程旧分支"
    skip_confirm: "🌱 如需跳过确认，请使用 -y 标志"
    get_current_branch_error: "无法获取当前分支: %v"
    switching_from_current: "正在从当前分支切换..."
    switch_branch_error: "无法切换到 %s 分支: %v"
    switched_to_branch: "已切换到 %s 分支"
    renaming_local: "🔄 正在重命名本地分支\n"
    rename_local_error: "重命名本地分支 %s 到 %s 失败: %v"
    rename_local_success: "成功将本地分支 %s 重命名为 %s"
    deleting_remote: "🗑️ 正在删除远程分支\n"
    delete_remote_error: "删除远程分支 %s 失败: %v"
    delete_remote_success: "远程分支 %s 删除成功"
    pushing_remote: "📤 正在推送到远程仓库\n"
    push_remote_error: "推送分支 %s 到远程仓库失败: %v"
    push_remote_success: "成功推送分支 %s 到远程仓库"
    manual_rename: "重命名分支: %s -> %s (%s)"
    manual_action: "%s 分支: %s (%s)"

  # Restore command
  restore:
    short: "恢复文件到未修改之前(alias: r)"
    long: "恢复指定的文件或目录到 HEAD 提交的状态，丢弃所有本地变更（包括已暂存的）"
    skip_confirm: "🌱 如需跳过确认，请使用 -y 标志"
    path_not_exist: "路径 %s 不存在"
    not_git_repo: "当前目录不是 git 仓库"
    restoring: "正在恢复 %s\n"
    restore_error: "恢复 %s 失败: %v"
    restore_success: "成功恢复 %s"
    check_changes_error: "检查 %s 变化时出错: %v"
    no_changes: "%s 没有变化，跳过"
    would_restore: "将恢复: %s"

  # Utils - Logger
  logger:
    error: "ERROR"
    warning: "WARNING"
    success: "✅"

  # Utils - Shell
  shell:
    config_read_error: "读取配置文件失败"
    executing_command: "🌈 正在执行命令: %s"
    command_failed: "执行命令失败: %v, 命令: %s"
    execute_failed: "执行命令失败: %v"

  # Utils - Config (additional config strings)
  utils_config:
    global_name: "全局配置"
    local_name: "本地配置"
    custom_name: "自定义配置"

  # Utils - PR (additional PR strings)
  pr_utils:
    browser_error: "无法打开浏览器: %v"
    pr_page_opened: "已打开 PR 页面: %s"
    syncing_branches: "正在同步生产分支 %s 到开发分支 %s..."
    dirty_working_dir: "工作目录不干净，请先提交或暂存当前的更改"
    current_branch_error: "无法获取当前分支: %v"
    executing: "执行: %s"
    command_failed: "命令执行失败: %v"
    error_output: "错误输出: %s"
    rolling_back: "正在回滚到原始分支 %s..."
    output: "输出: %s"
    sync_success: "成功同步 %s 到 %s"

  # Utils - Semver
  semver:
    invalid_version: "无效的版本号: %s"
    version_format_error: "版本号格式错误: %s"
    major_convert_error: "转换 MAJOR 部分出错: %v"
    minor_convert_error: "转换 MINOR 部分出错: %v"
    patch_convert_error: "转换 PATCH 部分出错: %v"
    invalid_version_part: "无效的版本部分: %s"
    command_failed: "执行命令失败: %v"

  # Utils - Git
  git:
    invalid_url_format: "invalid git URL format: %s"
    unsupported_url_format: "unsupported git URL format: %s"

# English
en-US:
  # Root command
  root:
    short: "GitHub Flow CLI"
    welcome: "🌈 Welcome to "
    confirm_flag: "Confirm operation"
    debug_flag: "Enable debug mode"

  # Init command
  init:
    short: "Initialize Github Flow configuration"
    force_flag: "Force overwrite existing configuration file"
    nickname_flag: "Set Github Flow nickname (optional)"
    config_exists_error: "Configuration file %s already exists, use force option to overwrite"
    create_config_error: "Failed to create configuration file: %v"
    generate_yaml_error: "Failed to generate YAML: %v"
    write_config_error: "Failed to write configuration file: %v"
    gitignore_skip: "Configuration file already exists in .gitignore, skip"

  # Copy command
  copy:
    short: "Copy current branch to new branch(alias: cp)"
    copying: " Copying branch...\n"
    success: "Successfully copied branch '%s' to '%s'"
    confirm_flag: "Require confirmation when auto-generating branch name"
    error:
      dirty: "Working directory is not clean, please commit or stash changes first"
      notInRemote: "Current branch '%s' does not exist in remote repository, please push it first"
      alreadyExists: "Branch '%s' already exists, please use a different name"
      failed: "Failed to copy branch: %v"
      confirm_required: "No branch name provided, will auto-generate '%s' -> '%s'"
    info:
      from: "Source branch"
      to: "Target branch"
      use_confirm_flag: "Use -y or --confirm flag to confirm operation"

  # Start command
  start:
    short: "Start a new feature (alias: s)"
    base_flag: "Specify base branch (@ for current branch)"
    syncing: " Syncing remote branches...\n"
    creating: " Creating branch...\n"
    success: "Created %s branch: %s"
    check_remote_failed: "Failed to check remote branches: %v"
    current_branch_not_exist: "Current branch '%s' does not exist in remote repository, please push it first"
