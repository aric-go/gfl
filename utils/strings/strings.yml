    priority_title: "\n🏆 Configuration Priority (High to Low):\n\n"
    priority_custom: "🥇 Custom Config File (GFL_CONFIG_FILE)\n"
    priority_local: "🥈 Local Config File (.gfl.config.local.yml)\n"
    priority_global: "🥉 Global Config File (.gfl.config.yml)\n"
    priority_default: "🏅 Default Value"

  # Rename command
  rename:
    short: "Rename a branch (supports local and remote)(alias: mv)"
    local_flag: "Rename local branch"
    remote_flag: "Rename remote branch"
    delete_flag: "Delete old remote branch"
    skip_confirm: "🌱 Use -y flag to skip confirmation"
    get_current_branch_error: "Failed to get current branch: %v"
    switching_from_current: "Switching from current branch..."
