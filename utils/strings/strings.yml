  # Publish command
  publish:
    short: "Publish current branch (alias: p)"
    pushing: " Pushing current branch to remote repository \n"
    success: "Pushed current branch to remote repository and set upstream branch"

  # Hotfix command
  hotfix:
    short: "Start a hotfix branch(alias: hf, hot)"
    syncing: " Syncing remote branches...\n"
    creating: " Creating Hotfix branch...\n"
    success: "Created Hotfix branch: %s"

  # Bugfix command
  bugfix:
    short: "Start a bug fix branch(alias: b, fix)"
    syncing: " Syncing remote branches...\n"
    creating: " Creating Bugfix branch...\n"
    success: "Created %s branch: %s"

  # Info command
  info:
    short: "Display repository info(alias: i)"
    current_branch: "Current Branch"
    tracking: "Tracking"
    not_tracking: "Not tracking"
    position: "Position"
    ahead: "↑%d ahead"
    behind: "↓%d behind"
    up_to_date: "✓ Up to date"
    working_dir: "Working Directory"
    working_dir_clean: "✅ Clean"
    working_dir_dirty: "⚠️  Dirty"
    remote: "Remote"
    not_configured: "Not configured"
    user_name: "User Name"
    user_email: "User Email"

  # Tag command
  tag:
    short: "Create Git tag version(alias: t)"
    previous_version: "🌈 Previous version: %s"
    new_version: "🎉 New version: %s"
    step1: "1. Switching to Release branch...\n"
